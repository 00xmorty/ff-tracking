# GEÇİCİ (G2 sürtünme denetimi): README adımlarını temiz runner'da birebir koşar.
# Merge edilmez; denetimden sonra dal silinir.
name: g2-surtunme
on:
  push:
    branches: [usta/g2-surtunme-denetimi]
  workflow_dispatch:

jobs:
  readme:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TSV: ${{ github.workspace }}/../g2-timing.tsv
    steps:
      - uses: actions/checkout@v4

      - name: 0. Temiz makine durumu (README'nin saydığı araçlar)
        run: |
          set +e
          uname -a
          for t in rustc cargo ffmpeg ffprobe python3 uv pkg-config nasm ninja; do
            printf '%-10s ' "$t"; (command -v "$t" && "$t" --version 2>&1 | head -1) || echo "YOK"
          done
          python3 -c 'import numpy, scipy; print("numpy/scipy var")' 2>&1 | tail -1
          nproc 2>/dev/null || sysctl -n hw.ncpu
          df -h / | tail -1

      - name: 1. README bağımlılıkları (apt satırı / macOS için brew)
        run: |
          set +e
          s=$(date +%s)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt install -y build-essential pkg-config libclang-dev libfontconfig1-dev libgl1-mesa-dev libvulkan1 ffmpeg
          else
            command -v ffmpeg >/dev/null || brew install ffmpeg
          fi
          rc=$?
          printf 'deps\t%s\t%s\n' "$rc" "$(( $(date +%s) - s ))" >> "$TSV"
          exit 0

      - name: 2. İlk derleme (render.sh'nin cargo build adımı)
        run: |
          set +e
          s=$(date +%s)
          cargo build --release -p hud -p flat -p lens 2>&1 | tail -40
          rc=${PIPESTATUS[0]}
          printf 'build\t%s\t%s\n' "$rc" "$(( $(date +%s) - s ))" >> "$TSV"
          exit 0

      - name: 3. README render komutu birebir (tools/render.sh, ek ayar yok)
        run: |
          set +e
          s=$(date +%s)
          tools/render.sh 2>&1 | tee render1.log | tail -40
          rc=${PIPESTATUS[0]}
          printf 'render-birebir\t%s\t%s\n' "$rc" "$(( $(date +%s) - s ))" >> "$TSV"
          exit 0

      - name: "4. Düzeltmelerle yeniden (eksik paketler tek tek, venv numpy/scipy, FF_BACKEND=cpu)"
        run: |
          set +e
          [ -f out/tracking.mp4 ] && { echo "birebir render çıktı verdi, atlandı"; exit 0; }
          s=$(date +%s)
          python3 -m venv "$RUNNER_TEMP/v" && "$RUNNER_TEMP/v/bin/pip" install numpy scipy 2>&1 | tail -1
          printf 'fix-venv-numpy-scipy\t%s\t%s\n' "$?" "$(( $(date +%s) - s ))" >> "$TSV"
          export PYTHON="$RUNNER_TEMP/v/bin/python"
          ok=1
          for pkg in "" libasound2-dev libx264-dev nasm; do
            if [ -n "$pkg" ]; then
              [ "$RUNNER_OS" = Linux ] || break
              sudo apt install -y "$pkg" 2>&1 | tail -1
              printf 'fix-apt-%s\t0\t0\n' "$pkg" >> "$TSV"
            fi
            s=$(date +%s)
            cargo build --release -p hud -p flat -p lens > build-$pkg.log 2>&1
            rc=$?
            tail -5 build-$pkg.log
            printf 'build-sonrasi-%s\t%s\t%s\n' "${pkg:-baslangic}" "$rc" "$(( $(date +%s) - s ))" >> "$TSV"
            [ $rc -eq 0 ] && { ok=0; break; }
          done
          [ $ok -eq 0 ] || exit 0
          s=$(date +%s)
          [ "$RUNNER_OS" = Linux ] && export FF_BACKEND=cpu
          tools/render.sh 2>&1 | tee render2.log | tail -40
          rc=${PIPESTATUS[0]}
          printf 'render-duzeltmeli-build-sonrasi\t%s\t%s\n' "$rc" "$(( $(date +%s) - s ))" >> "$TSV"
          exit 0

      - name: "4b. Hala düşüyorsa: x264 build 163'ü kaynaktan kur (Ubuntu 24.04 apt'te 164 var)"
        run: |
          set +e
          [ -f out/tracking.mp4 ] && { echo "render çıktı verdi, atlandı"; exit 0; }
          [ "$RUNNER_OS" = Linux ] || exit 0
          export PYTHON="$RUNNER_TEMP/v/bin/python"
          s=$(date +%s)
          git clone -q https://code.videolan.org/videolan/x264.git "$RUNNER_TEMP/x264" && cd "$RUNNER_TEMP/x264" \
            && git checkout -q 5db6aa6cab1b146e07b60cc1736a01f21da01154 \
            && grep -n "define X264_BUILD" x264.h \
            && ./configure --prefix="$RUNNER_TEMP/x264-163" --enable-shared --enable-pic >/dev/null \
            && make -j"$(nproc)" install >/dev/null
          printf 'fix-x264-kaynaktan\t%s\t%s\n' "$?" "$(( $(date +%s) - s ))" >> "$TSV"
          cd "$GITHUB_WORKSPACE"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/x264-163/lib/pkgconfig" LIBRARY_PATH="$RUNNER_TEMP/x264-163/lib" LD_LIBRARY_PATH="$RUNNER_TEMP/x264-163/lib" RUSTFLAGS="-L native=$RUNNER_TEMP/x264-163/lib"
          s=$(date +%s)
          cargo build --release -p hud -p flat -p lens > build-x264src.log 2>&1
          rc=$?; tail -5 build-x264src.log
          printf 'build-x264-kaynak-sonrasi\t%s\t%s\n' "$rc" "$(( $(date +%s) - s ))" >> "$TSV"
          [ $rc -eq 0 ] || exit 0
          s=$(date +%s)
          FF_BACKEND=cpu tools/render.sh 2>&1 | tee render3.log | tail -30
          rc=${PIPESTATUS[0]}
          printf 'render-x264-kaynak\t%s\t%s\n' "$rc" "$(( $(date +%s) - s ))" >> "$TSV"
          exit 0

      - name: 5. Çıktı doğrulama (ffprobe)
        run: |
          set +e
          if [ -f out/tracking.mp4 ]; then
            ffprobe -v error -show_entries stream=codec_type,width,height,nb_frames,duration -of compact out/tracking.mp4 | tee probe.txt
            ls -l out/tracking.mp4
          else
            echo "out/tracking.mp4 YOK" | tee probe.txt
          fi
          exit 0

      - name: Özet
        if: always()
        run: |
          {
            echo "## ${{ matrix.os }}"
            echo '| adım | çıkış | süre (s) |'; echo '|---|---|---|'
            awk -F'\t' '{printf "| %s | %s | %s |\n",$1,$2,$3}' "$TSV"
            echo; echo '```'; cat probe.txt; echo '```'
            echo "backend satırları:"; echo '```'; grep -hi 'backend' render1.log render2.log 2>/dev/null | head -5; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-${{ matrix.os }}
          path: |
            render1.log
            render2.log
            render3.log
            build-*.log
            probe.txt
            out/tracking.mp4
          if-no-files-found: ignore
